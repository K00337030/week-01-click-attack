<!DOCTYPE HTML>
<html lang="en">

    <head>

        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial scale=1.0">
        <title>Practical Mission</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>

    </head>

    <body>

        <h1><span id="title">Click Attack</span></h1>
        <h2>The Button Game</h2>

        <div class="card">
          <label for="playerName">Player name:</label>
          <input id="playerName" type="text">

          <label for="attackValue">Attack value:</label>
          <input id="attackValue" type="number" min="1" max="10" value="1">
        </div>

        <p id="message" class="feedback">
          Enter your name and choose an attack value.
        </p>

        <p>Score: <span id="score">0</span></p>

        <button id="attackButton">Attack</button>
        <button id="resetButton">Reset</button>
        <button id="powerButton">Power Attack</button>

        <section class="card">
          <h2>Attack history</h2>
          <ul id="history"></ul>
        </section>

    </body>

</html>
